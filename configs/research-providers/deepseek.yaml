# Example model. API keys belong in environment variables, never in this file.
# DeepSeek Flash and the standalone Search API use the same key in separate calls.
literature:
  model_search:
    provider: deepseek
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    api_format: chat_completions
    mode: external
    max_output_tokens: 6000
    max_search_calls: 4
    timeout_seconds: 180
    external_search:
      provider: deepseek
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      max_results: 5
