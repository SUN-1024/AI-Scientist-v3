# Fill in model. API keys belong in environment variables, never in this file.
literature:
  model_search:
    provider: gemini_generate_content
    model: ''
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    api_format: gemini_generate_content
    mode: native
    max_output_tokens: 6000
    max_search_calls: 4
    timeout_seconds: 180
