# Fill in model. API keys belong in environment variables, never in this file.
literature:
  model_search:
    provider: xai
    model: ''
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    api_format: responses
    mode: native
    max_output_tokens: 6000
    max_search_calls: 4
    timeout_seconds: 180
